services:
  minecraft-server:
    image: itzg/minecraft-server
    container_name: minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    volumes:
      - ./data:/data
    environment:
      EULA: "TRUE"
      MEMORY: 6G
      TYPE: "FABRIC"
      VERSION: "LATEST"
      WHITELIST: ${WHITELIST:-}
      SEED: ${SEED:-}
      DIFFICULTY: "HARD"
      REMOVE_OLD_MODS: "TRUE"
      VANILLATWEAKS_SHARECODE: "p5vukZ"
      MODRINTH_PROJECTS: |
        lithium
        scalablelux
        ferrite-core
